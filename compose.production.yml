services:
  postgres:
    image: postgres:16-alpine
    container_name: mi-san-postgres
    restart: unless-stopped
    env_file:
      - apps/api/.env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-misan}
      POSTGRES_USER: ${POSTGRES_USER:-misan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - mi_san_postgres_data:/var/lib/postgresql/data
    networks:
      - mi_san_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-misan} -d ${POSTGRES_DB:-misan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mi-san-api
    restart: unless-stopped
    env_file:
      - apps/api/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    # Exposed only through the proxy network in production.
    # ports:
    #   - "127.0.0.1:${API_PORT:-3000}:3000"
    expose:
      - "3000"
    volumes:
      - mi_san_api_uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mi_san_internal
      - npm_proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  public-site:
    build:
      context: ./apps/public-site
      dockerfile: Dockerfile
    container_name: mi-san-public-site
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - npm_proxy

volumes:
  mi_san_postgres_data:
  mi_san_api_uploads:

networks:
  mi_san_internal:
    name: mi_san_internal
  npm_proxy:
    external: true
    name: ${PROXY_NETWORK:-npm_proxy}
